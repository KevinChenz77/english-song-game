<div class="bar">
  <button type="button" class="ghost" [routerLink]="['/kids', kidId()]">← 回去</button>
</div>
@if (song.value(); as s) {
  <h1>{{ s.emoji }} {{ s.title }}</h1>
}
@if (content.error(); as e) {
  <p>{{ e.message }}</p>
  <button type="button" (click)="content.reload()">重試</button>
} @else if (content.value(); as c) {
  <p>歌詞 {{ c.lines.length }} 句（畫面第二波實作）</p>
} @else {
  <p>歌詞載入中…</p>
}
