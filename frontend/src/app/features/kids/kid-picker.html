<div class="bar">
  <h1>🎵 唱歌學英文</h1>
  <button type="button" class="ghost" routerLink="/help">❓ 遊戲說明</button>
  <button type="button" class="ghost" (click)="cloud.open('load')">📥 匯入</button>
</div>
<p>誰要玩呢？</p>
<div class="grid">
  @for (k of store.kids(); track k.id) {
    <div class="kid">
      <a class="card" [routerLink]="['/kids', k.id]">
        <div class="big">{{ k.avatar }}</div>
        <div>{{ k.name }}</div>
        <div>⭐ {{ stars(k) }}</div>
      </a>
      <button type="button" class="del" [attr.aria-label]="'刪除 ' + k.name" (click)="remove(k)">✕</button>
    </div>
  }
  <button #addBtn type="button" class="card add" (click)="open()">
    <div class="big">➕</div>
    <div>新增小朋友</div>
  </button>
</div>
@if (adding()) {
  <div class="form">
    <label>名字：<input #name placeholder="例如：小明" aria-describedby="nameMsg" (keydown.enter)="add(name)" /></label>
    <p id="nameMsg" class="bad" role="status">{{ nameMsg() }}</p>
    <div class="avs" role="group" aria-label="頭像">
      @for (a of avatars; track a) {
        <button type="button" [attr.aria-pressed]="a === avatar()" [class.sel]="a === avatar()" (click)="avatar.set(a)">
          {{ a }}
        </button>
      }
    </div>
    <button type="button" (click)="add(name)">好了！</button>
    <button type="button" class="ghost" (click)="cancel()">取消</button>
  </div>
}
