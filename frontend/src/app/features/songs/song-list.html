<div class="bar"><button type="button" class="ghost" routerLink="/">← 換人</button></div>
@if (kid(); as k) {
  <h1>嗨 {{ k.avatar }} {{ k.name }}！選一首歌</h1>
  @if (catalog.songs.hasValue()) {
    <div class="grid">
      @for (s of catalog.songs.value(); track s.id) {
        <a [routerLink]="['play', s.id]"><app-song-card [song]="s" [progress]="k.songs[s.id] ?? {}" /></a>
      }
    </div>
  } @else if (catalog.songs.error()) {
    <p>歌曲清單讀不到 😢 請確認網路後再試一次。</p>
    <button type="button" (click)="catalog.songs.reload()">重試</button>
  } @else {
    <p>歌曲載入中…</p>
  }
  <div class="stickers">
    我的貼紙：
    @for (s of k.stickers; track $index) {
      <span>{{ s }}</span>
    } @empty {
      <span>還沒有，加油！</span>
    }
  </div>
}
